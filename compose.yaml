services:
  catalog:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CATALOG_PATH: ${CATALOG_PATH:-data/releases.json}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
