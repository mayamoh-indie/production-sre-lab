[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "production-sre-lab"
version = "0.1.0"
description = "A release catalog for practicing reliable platform delivery"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.34,<1", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "bandit>=1.8,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP045"]
